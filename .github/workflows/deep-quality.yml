name: Deep Quality

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  critical-branch-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-07-01
          components: llvm-tools-preview
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # main
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Measure critical-core branch coverage
        run: >-
          cargo +nightly-2026-07-01 llvm-cov
          --branch
          --package tm-auth
          --package tm-domain
          --package tm-pubsub
          --package tm-runtime
          --package tm-twitch
          --all-features
          --locked
          --json
          --output-path critical-core-branch-coverage.json
      - name: Enforce critical-core branch coverage
        shell: pwsh
        run: >-
          ./scripts/verify-branch-coverage.ps1
          -ReportPath critical-core-branch-coverage.json
          -MinimumPercent 60
      - name: Measure application branch coverage
        run: >-
          cargo +nightly-2026-07-01 llvm-cov
          --branch
          --package tm-app
          --all-features
          --locked
          --json
          --output-path tm-app-branch-coverage.json
      - name: Enforce application branch coverage
        shell: pwsh
        run: >-
          ./scripts/verify-branch-coverage.ps1
          -ReportPath tm-app-branch-coverage.json
          -MinimumPercent 46.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-branch-coverage
          path: |
            critical-core-branch-coverage.json
            tm-app-branch-coverage.json
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-07-01
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz transport parsers
        run: cargo +nightly-2026-07-01 fuzz run transport_parsers -- -max_total_time=120 -max_len=65536
      - name: Fuzz structured input parsers
        run: cargo +nightly-2026-07-01 fuzz run structured_input -- -max_total_time=120 -max_len=65536
