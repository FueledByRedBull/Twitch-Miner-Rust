name: Persisted Query Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.0
      - run: cargo run -p tm-twitch --example apq_probe --locked
