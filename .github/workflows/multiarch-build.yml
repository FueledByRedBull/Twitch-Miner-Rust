name: Multiarch Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  rust-qa:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-qa.yml

  reproducible-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.94.0

      - name: Verify reproducible release build
        shell: pwsh
        run: ./scripts/verify-build-integrity.ps1

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_tag: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build_metadata
        run: |
          "epoch=$(git show -s --format=%ct $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=multiarch-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=multiarch-${{ matrix.platform_tag }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.build_metadata.outputs.epoch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - id: runtime
        name: Resolve runtime child digest
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $buildDigest = '${{ steps.build.outputs.digest }}'
          $runtimeDigest = (& ./scripts/resolve-platform-digest.ps1 `
            -ImageReference "$image@$buildDigest" `
            -Platform '${{ matrix.platform }}' | Out-String).Trim()
          if ($runtimeDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "BuildKit did not return a valid runtime digest for ${{ matrix.platform }}: $runtimeDigest"
          }
          "digest=$runtimeDigest" >> $env:GITHUB_OUTPUT

      - name: Smoke test image
        run: |
          $image = "${{ steps.image.outputs.name }}@${{ steps.runtime.outputs.digest }}"
          docker run --rm --platform "${{ matrix.platform }}" $image --help
          $version = docker run --rm --platform "${{ matrix.platform }}" $image --version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch [regex]::Escape('${{ github.sha }}')) {
            throw "Version metadata smoke test failed for ${{ matrix.platform }}: $($version -join ' ')"
          }
          $health = docker run --rm --platform "${{ matrix.platform }}" $image --health 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw 'Health validation unexpectedly passed without a runtime status file.'
          }
          if (($health -join "`n") -notmatch 'runtime[- ]status|runtime status') {
            throw "Health validation failed for an unexpected reason on ${{ matrix.platform }}: $($health -join ' ')"
          }
          exit 0
        shell: pwsh

      - name: Export the BuildKit SPDX SBOM for the pushed child image
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'
          $sbom = docker buildx imagetools inspect $image --format '{{ json .SBOM.SPDX }}' 2>&1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($sbom -join ''))) {
            throw "Unable to export the BuildKit SPDX SBOM for $image."
          }
          try {
            $document = ($sbom -join "`n") | ConvertFrom-Json
          } catch {
            throw 'BuildKit returned an invalid SPDX SBOM document.'
          }
          if ($document.spdxVersion -notmatch '^SPDX-' -or
              @($document.packages | Where-Object { $_.name -and $_.SPDXID }).Count -eq 0) {
            throw 'BuildKit returned an incomplete SPDX SBOM document.'
          }
          [System.IO.File]::WriteAllText(
            '${{ runner.temp }}/twitch-miner-${{ matrix.platform_tag }}.spdx.json',
            ($document | ConvertTo-Json -Depth 100),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Attest platform SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          sbom-path: ${{ runner.temp }}/twitch-miner-${{ matrix.platform_tag }}.spdx.json
          push-to-registry: true

      - name: Attest platform image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/digests" -Force | Out-Null
          $digest = "${{ steps.runtime.outputs.digest }}"
          New-Item -ItemType File -Path "$env:RUNNER_TEMP/digests/$($digest.Replace('sha256:',''))" -Force | Out-Null
        shell: pwsh
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        id: digest_file

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform_tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
      - reproducible-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a branch source ref for candidate publication
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          $event = '${{ github.event_name }}'
          if ($ref -notmatch '^refs/heads/[A-Za-z0-9._/-]+$' -or
              ($event -eq 'push' -and $ref -ne 'refs/heads/main')) {
            throw "Candidate publication requires a branch ref (pushes are main-only); got ref='$ref' event='$event'."
          }

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifactsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $response = Invoke-RestMethod -Uri $artifactsUri -Headers $headers
          $artifacts = @($response.artifacts | Where-Object {
            -not $_.expired -and $_.name -match '^digests-(amd64|arm64)$'
          })
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly two image digest artifacts, found $($artifacts.Count)."
          }

          $destination = '${{ runner.temp }}/digests'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($artifact in $artifacts) {
            $archive = Join-Path '${{ runner.temp }}' "$($artifact.name).zip"
            Invoke-WebRequest -Uri $artifact.archive_download_url `
              -Headers $headers `
              -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            Remove-Item -LiteralPath $archive -Force
          }
          $digests = @(Get-ChildItem -LiteralPath $destination -File)
          if ($digests.Count -ne 2 -or
              @($digests | Where-Object { $_.Name -notmatch '^[0-9a-f]{64}$' }).Count -ne 0) {
            throw 'Downloaded image digest artifacts were incomplete or malformed.'
          }

      - id: manifest
        name: Create candidate manifest list
        run: |
          $images = Get-ChildItem '${{ runner.temp }}/digests' -File | ForEach-Object {
            "${{ steps.image.outputs.name }}@sha256:$($_.BaseName)"
          }
          if (-not $images) {
            throw 'No image digests were produced.'
          }
          New-Item -ItemType Directory -Path '${{ runner.temp }}/manifest' -Force | Out-Null
          $metadata = '${{ runner.temp }}/manifest/metadata.json'
          $candidateTag = "${{ steps.image.outputs.name }}:candidate-${{ github.sha }}-${{ github.run_id }}"
          $arguments = @('buildx', 'imagetools', 'create', '--tag', $candidateTag, '--metadata-file', $metadata) + $images
          docker @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish candidate manifest $candidateTag."
          }
          $manifestInfo = Get-Content -Raw $metadata | ConvertFrom-Json
          $digest = $manifestInfo.'containerimage.descriptor'.digest
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Manifest publication did not provide a valid digest.'
          }
          "digest=$digest" >> $env:GITHUB_OUTPUT
          "candidate=$candidateTag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Smoke test published manifest digest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $digest = '${{ steps.manifest.outputs.digest }}'
          $verified = ./scripts/verify-published-manifest.ps1 `
            -ImageReference "$image@$digest" `
            -ExpectedDigest $digest `
            -ExpectedRevision '${{ github.sha }}' `
            -Repository $env:GITHUB_REPOSITORY `
            -SignerWorkflow "$env:GITHUB_REPOSITORY/.github/workflows/multiarch-build.yml" `
            -SourceRef '${{ github.ref }}' `
            -VerifyAttestations
          if ($verified -ne $digest) {
            throw "Published manifest verification returned unexpected digest $verified."
          }
          Set-Content -Path '${{ runner.temp }}/manifest/digest.txt' -Value $digest -NoNewline
          exit 0

      - name: Publish consumer aliases after verification
        shell: pwsh
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $digest = '${{ steps.manifest.outputs.digest }}'
          $tags = @($env:IMAGE_TAGS -split "\r?\n" | Where-Object { $_ })
          if ($tags.Count -eq 0) {
            throw 'No consumer aliases were generated.'
          }
          $arguments = @('buildx', 'imagetools', 'create')
          foreach ($tag in $tags) {
            $arguments += '--tag', $tag
          }
          $arguments += "$image@$digest"
          docker @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Consumer alias publication failed.'
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-digest
          path: ${{ runner.temp }}/manifest/digest.txt
          if-no-files-found: error
