name: Multiarch Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  rust-qa:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-qa.yml

  reproducible-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.94.0

      - name: Verify reproducible release build
        shell: pwsh
        run: ./scripts/verify-build-integrity.ps1

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - rust-qa
      - reproducible-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build_metadata
        run: |
          "time=$(git show -s --format=%cI $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT
          "epoch=$(git show -s --format=%ct $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: |
            type=gha,scope=multiarch
            type=gha,scope=multiarch-amd64
            type=gha,scope=multiarch-arm64
            type=gha,scope=multiarch-arm-v7
          cache-to: type=gha,mode=max,scope=multiarch
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.build_metadata.outputs.time }}
            SOURCE_DATE_EPOCH=${{ steps.build_metadata.outputs.epoch }}
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test published manifest digest
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $digest = '${{ steps.build.outputs.digest }}'
          $verified = ./scripts/verify-published-manifest.ps1 `
            -ImageReference "$image@$digest" `
            -ExpectedDigest $digest `
            -ExpectedRevision '${{ github.sha }}'
          if ($verified -ne $digest) {
            throw "Published manifest verification returned unexpected digest $verified."
          }
          New-Item -ItemType Directory -Path '${{ runner.temp }}/manifest' -Force | Out-Null
          Set-Content -Path '${{ runner.temp }}/manifest/digest.txt' -Value $digest -NoNewline
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-digest
          path: ${{ runner.temp }}/manifest/digest.txt
          if-no-files-found: error

  release-manifest:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: promote
        name: Promote tested commit manifest
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $source = "${image}:sha-${{ github.sha }}"
          $digest = ./scripts/verify-published-manifest.ps1 `
            -ImageReference $source `
            -ExpectedRevision '${{ github.sha }}'

          $release = "${image}:${{ github.ref_name }}"
          docker buildx imagetools create --tag $release "$image@$digest"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to promote $source to $release."
          }

          $promoted = ./scripts/verify-published-manifest.ps1 `
            -ImageReference $release `
            -ExpectedDigest $digest `
            -ExpectedRevision '${{ github.sha }}'
          if ($promoted -ne $digest) {
            throw "Release tag resolved to $promoted instead of tested digest $digest."
          }

          New-Item -ItemType Directory -Path '${{ runner.temp }}/manifest' -Force | Out-Null
          Set-Content -Path '${{ runner.temp }}/manifest/digest.txt' -Value $digest -NoNewline
          "digest=$digest" >> $env:GITHUB_OUTPUT

      - name: Attest release manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-digest
          path: ${{ runner.temp }}/manifest/digest.txt
          if-no-files-found: error
