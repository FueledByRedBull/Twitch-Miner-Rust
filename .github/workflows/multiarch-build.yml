name: Multiarch Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  rust-qa:
    permissions:
      contents: read
    uses: ./.github/workflows/rust-qa.yml

  reproducible-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.94.0

      - name: Verify reproducible release build
        shell: pwsh
        run: ./scripts/verify-build-integrity.ps1

  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_tag: amd64
          - platform: linux/arm64
            platform_tag: arm64
          - platform: linux/arm/v7
            platform_tag: arm-v7
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: build_metadata
        run: |
          "time=$(git show -s --format=%cI $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT
          "epoch=$(git show -s --format=%ct $env:GITHUB_SHA)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=multiarch-${{ matrix.platform_tag }}
          cache-to: type=gha,mode=max,scope=multiarch-${{ matrix.platform_tag }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.build_metadata.outputs.time }}
            SOURCE_DATE_EPOCH=${{ steps.build_metadata.outputs.epoch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test image
        run: |
          docker run --rm --platform "${{ matrix.platform }}" "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --help
          $version = docker run --rm --platform "${{ matrix.platform }}" "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --version 2>&1
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch [regex]::Escape('${{ github.sha }}')) {
            throw "Version metadata smoke test failed for ${{ matrix.platform }}: $($version -join ' ')"
          }
          $health = docker run --rm --platform "${{ matrix.platform }}" "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --health 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw 'Health validation unexpectedly passed without a runtime status file.'
          }
          if (($health -join "`n") -notmatch 'runtime[- ]status|runtime status') {
            throw "Health validation failed for an unexpected reason on ${{ matrix.platform }}: $($health -join ' ')"
          }
          exit 0
        shell: pwsh

      - name: Export digest
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/digests" -Force | Out-Null
          $digest = "${{ steps.build.outputs.digest }}"
          New-Item -ItemType File -Path "$env:RUNNER_TEMP/digests/$($digest.Replace('sha256:',''))" -Force | Out-Null
        shell: pwsh
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        id: digest_file

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.platform_tag }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build
      - reproducible-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifactsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $response = Invoke-RestMethod -Uri $artifactsUri -Headers $headers
          $artifacts = @($response.artifacts | Where-Object {
            -not $_.expired -and $_.name -match '^digests-(amd64|arm64|arm-v7)$'
          })
          if ($artifacts.Count -ne 3) {
            throw "Expected exactly three image digest artifacts, found $($artifacts.Count)."
          }

          $destination = '${{ runner.temp }}/digests'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($artifact in $artifacts) {
            $archive = Join-Path '${{ runner.temp }}' "$($artifact.name).zip"
            Invoke-WebRequest -Uri $artifact.archive_download_url `
              -Headers $headers `
              -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            Remove-Item -LiteralPath $archive -Force
          }
          $digests = @(Get-ChildItem -LiteralPath $destination -File)
          if ($digests.Count -ne 3 -or
              @($digests | Where-Object { $_.Name -notmatch '^[0-9a-f]{64}$' }).Count -ne 0) {
            throw 'Downloaded image digest artifacts were incomplete or malformed.'
          }

      - id: manifest
        name: Create manifest list
        run: |
          $images = Get-ChildItem '${{ runner.temp }}/digests' -File | ForEach-Object {
            "${{ steps.image.outputs.name }}@sha256:$($_.BaseName)"
          }
          if (-not $images) {
            throw 'No image digests were produced.'
          }
          New-Item -ItemType Directory -Path '${{ runner.temp }}/manifest' -Force | Out-Null
          $metadata = '${{ runner.temp }}/manifest/metadata.json'
          $tags = ($env:IMAGE_TAGS -split "\r?\n") | Where-Object { $_ }
          for ($index = 0; $index -lt $tags.Count; $index++) {
            $arguments = @('buildx', 'imagetools', 'create', '--tag', $tags[$index])
            if ($index -eq 0) {
              $arguments += '--metadata-file', $metadata
            }
            $arguments += $images
            docker @arguments
          }
          $manifestInfo = Get-Content -Raw $metadata | ConvertFrom-Json
          $digest = $manifestInfo.'containerimage.descriptor'.digest
          if ($digest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Manifest publication did not provide a valid digest.'
          }
          "digest=$digest" >> $env:GITHUB_OUTPUT
        shell: pwsh
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Smoke test published manifest digest
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $digest = '${{ steps.manifest.outputs.digest }}'
          $verified = ./scripts/verify-published-manifest.ps1 `
            -ImageReference "$image@$digest" `
            -ExpectedDigest $digest `
            -ExpectedRevision '${{ github.sha }}'
          if ($verified -ne $digest) {
            throw "Published manifest verification returned unexpected digest $verified."
          }
          Set-Content -Path '${{ runner.temp }}/manifest/digest.txt' -Value $digest -NoNewline
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-digest
          path: ${{ runner.temp }}/manifest/digest.txt
          if-no-files-found: error

  release-manifest:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: rust-qa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - id: image
        run: |
          "name=ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: promote
        name: Promote tested commit manifest
        shell: pwsh
        run: |
          $image = '${{ steps.image.outputs.name }}'
          $source = "${image}:sha-${{ github.sha }}"
          $digest = ./scripts/verify-published-manifest.ps1 `
            -ImageReference $source `
            -ExpectedRevision '${{ github.sha }}'

          $release = "${image}:${{ github.ref_name }}"
          docker buildx imagetools create --tag $release "$image@$digest"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to promote $source to $release."
          }

          $promoted = ./scripts/verify-published-manifest.ps1 `
            -ImageReference $release `
            -ExpectedDigest $digest `
            -ExpectedRevision '${{ github.sha }}'
          if ($promoted -ne $digest) {
            throw "Release tag resolved to $promoted instead of tested digest $digest."
          }

          New-Item -ItemType Directory -Path '${{ runner.temp }}/manifest' -Force | Out-Null
          Set-Content -Path '${{ runner.temp }}/manifest/digest.txt' -Value $digest -NoNewline
          "digest=$digest" >> $env:GITHUB_OUTPUT

      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-manifest-digest
          path: ${{ runner.temp }}/manifest/digest.txt
          if-no-files-found: error
