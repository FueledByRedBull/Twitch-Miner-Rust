name: Rust QA

on:
  workflow_call:

jobs:
  rust-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Reject production panic shortcuts
        run: cargo clippy --workspace --exclude tm-contract-tests --exclude tm-integration-tests --lib --bins --examples --all-features --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::todo -D clippy::unimplemented

      - name: Test workspace
        run: cargo test --workspace --locked --quiet

      - name: Run deterministic replay benchmark
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: cargo run -p tm-integration-tests --example replay_benchmark --release --locked --quiet > replay-benchmark.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replay-benchmark
          path: replay-benchmark.json
          if-no-files-found: error

      - name: Check rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps

      - name: Verify deterministic release metadata and build integrity
        shell: pwsh
        run: ./scripts/verify-build-integrity.ps1
