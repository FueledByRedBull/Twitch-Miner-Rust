[package]
name = "twitch-miner-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde_json = "1.0.145"
tm-auth = { path = "../crates/tm-auth", version = "0.2.0" }
tm-config = { path = "../crates/tm-config", version = "0.2.0" }
tm-pubsub = { path = "../crates/tm-pubsub", version = "0.2.0" }
tm-twitch = { path = "../crates/tm-twitch", version = "0.2.0" }

[[bin]]
name = "transport_parsers"
path = "fuzz_targets/transport_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_input"
path = "fuzz_targets/structured_input.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
